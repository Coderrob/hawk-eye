
name: Python3 CI

on: ["push", "pull_request"]

permissions:
  contents: read

jobs:

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          hawk_eye/setup/requirements.txt
          hawk_eye/setup/requirements-cpu.txt
          hawk_eye/setup/requirements-gpu.txt

    - name: Setup Machine
      run: hawk_eye/setup/setup_env.sh

    - name: Authenticate on GCS
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        version: '290.0.1'

    - name: Cache Bazel Deps
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/bazel
          ~/runs
        key: ${{ runner.os }}-bazel

    - name: Test
      run: |
        bazel test --test_output=streamed //...

    - name: Style Test
      run: |
        black --check .
        isort --check-only .
        flake8
        python tools/python_lint.py

    - name: Quality Gates
      run: python tools/quality_gates.py

    - name: Ensure .whl Tests Run
      run: ./setup.py test

    - name: Create hawk_eye .whl package
      run: ./setup.py bdist_wheel
