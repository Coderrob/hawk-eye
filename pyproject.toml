[tool.black]
line-length = 90
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.eggs
  | __pycache__
  | bazel-.*
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 90
force_sort_within_sections = true
combine_as_imports = true
known_first_party = ["hawk_eye"]
known_third_party = [
  "albumentations",
  "cv2",
  "google",
  "numpy",
  "PIL",
  "pycocotools",
  "requests",
  "torch",
  "tqdm",
  "yaml",
]
skip_glob = ["bazel-*", "third_party/*"]
